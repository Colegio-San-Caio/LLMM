<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iframe.frame - Evaluation Macro</title>
<style>
  body { background:#0d1117; color:#c9d1d9; font-family:ui-monospace,Menlo,Consolas,monospace; margin:0; padding:16px; }
  h1 { font-size:2rem; margin:24px 0 16px; }
  .box { background:#010409; border:1px solid #30363d; border-radius:10px; padding:14px 16px; line-height:1.5; }
  .ok { color:#3fb950; }
  a { color:#58a6ff; }
  label { display:block; margin:22px 0 8px; font-size:1.05rem; }
  textarea { width:100%; box-sizing:border-box; min-height:200px; background:#161b22; color:#c9d1d9; border:1px solid #30363d; border-radius:10px; padding:12px; font:inherit; font-size:0.95rem; }
  #out { border-color:#3fb950; }
  .row { display:flex; gap:10px; align-items:center; margin:16px 0; flex-wrap:wrap; }
  button { background:#238636; color:#fff; border:0; border-radius:8px; padding:14px 18px; font:inherit; font-weight:700; }
  button.alt { background:#30363d; }
  #status { color:#8b949e; font-size:0.9rem; }
</style>
</head>
<body>
<h1>iframe.frame - Evaluation Macro</h1>
<div class="box">
  <span class="ok">&#9679; LLMM HTML Macro</span> | Converts deprecated &lt;frame&gt; &rarr; modern &lt;iframe&gt; | Like R.go but for HTML
  Org: enforced_repositories=all | SHA: <span id="sha">3ca39d44</span> | <a href="index.html">&larr; back to index.html</a>
</div>

<label for="in">1. Paste OLD HTML with &lt;frameset&gt;&lt;frame&gt;:</label>
<textarea id="in" spellcheck="false">&lt;html&gt;
&lt;frameset rows="20%,80%"&gt;
  &lt;frame src="header.html" name="top"&gt;
  &lt;frame src="body.html" name="main"&gt;
&lt;/frameset&gt;
&lt;/html&gt;</textarea>

<div class="row">
  <button id="go">&#9654; EVALUATE &rarr; Convert to iframe</button>
  <button id="copy" class="alt">Copy</button>
  <span id="status">ready</span>
</div>

<label for="out">2. NEW HTML (iframe):</label>
<textarea id="out" spellcheck="false" readonly></textarea>

<script>
var $ = function (id) { return document.getElementById(id); };
var dropped = false;

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// frameset sizes: "20%", "150", "*", "2*"  ->  CSS grid tracks
function tracks(v) {
  return v.split(',').map(function (t) {
    t = t.trim();
    if (t === '' || t === '*') return '1fr';
    if (/^\d+\*$/.test(t)) return parseInt(t, 10) + 'fr';
    if (/%$/.test(t)) return t;
    if (/^\d+(\.\d+)?$/.test(t)) return t + 'px';
    return '1fr';
  }).join(' ');
}

function gridStyle(fs) {
  var rows = fs.getAttribute('rows'), cols = fs.getAttribute('cols');
  var s = 'display:grid;';
  if (rows) s += 'grid-template-rows:' + tracks(rows) + ';'; else s += 'grid-auto-rows:1fr;';
  if (cols) s += 'grid-template-columns:' + tracks(cols) + ';'; else s += 'grid-auto-columns:1fr;';
  return s;
}

function convert(el, depth) {
  var pad = new Array(depth + 1).join('  ');
  var out = '';
  Array.prototype.forEach.call(el.children, function (c) {
    var tag = c.tagName.toLowerCase();
    if (tag === 'frame') {
      var a = '';
      ['src', 'name', 'scrolling', 'title'].forEach(function (k) {
        if (c.getAttribute(k)) a += ' ' + k + '="' + esc(c.getAttribute(k)) + '"';
      });
      out += pad + '<iframe' + a + ' style="border:0;width:100%;height:100%"></iframe>\n';
    } else if (tag === 'frameset') {
      out += pad + '<div style="' + gridStyle(c) + 'min-width:0;min-height:0">\n' +
             convert(c, depth + 1) + pad + '</div>\n';
    } else if (tag === 'noframes') {
      dropped = true;
    }
  });
  return out;
}

function evaluate() {
  var src = $('in').value, html, note;
  dropped = false;
  var doc = new DOMParser().parseFromString(src, 'text/html');
  var fs = doc.querySelector('frameset');
  if (fs) {
    var title = doc.title ? '  <title>' + doc.title.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</title>\n' : '';
    html = '<!DOCTYPE html>\n<html>\n<head>\n  <meta charset="utf-8">\n' + title + '</head>\n' +
           '<body style="margin:0;height:100vh;' + gridStyle(fs) + '">\n' +
           convert(fs, 1) + '</body>\n</html>\n';
    note = 'frameset converted to CSS grid';
  } else {
    html = src.replace(/<frame\b([^>]*?)\/?>/gi, function (m, a) {
      return '<iframe' + a + ' style="border:0;width:100%;height:100%"></iframe>';
    });
    note = 'no <frameset> found, only <frame> tags swapped';
  }
  var n = (html.match(/<iframe/g) || []).length;
  $('out').value = html;
  $('status').textContent = n + ' iframe(s) - ' + note + (dropped ? ' - <noframes> dropped' : '');
}

function copyOut() {
  var t = $('out');
  t.select();
  if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(function () { document.execCommand('copy'); });
  else document.execCommand('copy');
  $('status').textContent = 'copied';
}

$('go').addEventListener('click', evaluate);
$('copy').addEventListener('click', copyOut);

fetch('https://api.github.com/repos/Colegio-San-Caio/LLMM/commits/main')
  .then(function (r) { return r.json(); })
  .then(function (d) { if (d.sha) $('sha').textContent = d.sha.slice(0, 7); })
  .catch(function () {});
</script>
</body>
</html>
