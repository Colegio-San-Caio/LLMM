name: Build and run ISSN.m + R.go
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build ISSN.m + R.go
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go run R.go || true
          go build -o R R.go
          ./R || true
          sha256sum R R.go
          gh api /repos/${{ github.repository }}/immutable-releases --method PUT || true
      - uses: actions/upload-artifact@v4
        with:
          name: LLMM-binaries
          path: |
            R
            R.go
